name: Release

# Changesets flow: merging changeset files into main opens/updates a
# "Version Packages" PR; merging THAT PR releases the version. main never
# holds dist/ (it is gitignored): the release builds it, smoke-tests it, and
# commits it on top of the merged commit, on no branch. That commit is tagged
# v1.2.3, the major tag (v1) users pin to moves to it, and its GitHub Release
# gets the version's CHANGELOG.md section. Nothing is published to npm: an
# action runs from this repository at a tag. The Action is listed on the
# GitHub Marketplace, where each new release appears on its own (see
# CONTRIBUTING.md).
on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Open or update the Version Packages PR
        id: changesets
        uses: changesets/action@v2

      # With no changesets left, main's version is released unless its tag
      # already exists (every push after a release, and Dependabot merges).
      - name: Check whether this version is released
        id: version
        if: steps.changesets.outputs.has-changesets == 'false'
        run: |
          VERSION=$(jq -r .version package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already released."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build dist/
        if: steps.version.outputs.release == 'true'
        run: pnpm build

      # The action from this build, before anything is tagged.
      - name: Smoke-test the build
        if: steps.version.outputs.release == 'true'
        uses: ./
        with:
          path: fixtures/clean

      - name: Tag the release, with dist/
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --force dist
          git commit --quiet -m "v$VERSION: dist/ for the release"
          git tag "v$VERSION"
          git push origin "refs/tags/v$VERSION"
          MAJOR="v${VERSION%%.*}"
          git tag --force "$MAJOR"
          git push --force origin "refs/tags/$MAJOR"
          echo "v$VERSION and $MAJOR point to $(git rev-parse HEAD), on top of $GITHUB_SHA"

      - name: Create the GitHub Release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v heading="## $VERSION" '$0 == heading { found = 1; next } found && /^## / { exit } found' \
            CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
